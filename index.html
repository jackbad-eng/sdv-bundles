<style>

  .score span{color:var(--inkSoft)}
  .headrow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}

  nav button{

const BUILD="2026-07-28f";

const ALL=ROOMS.flatMap(r=>r.bundles.map(b=>({...b,roomId:r.id,roomName:r.name,color:r.color})));
const K=(b,i)=>b+"#"+i;
const KEY="cc-progress-v1", META="cc-meta-v1";

// Flat slot index — stable order used by the backup codec.
const FLAT=[]; ROOMS.forEach(r=>r.bundles.forEach(b=>b.items.forEach((_,i)=>FLAT.push(K(b.id,i)))));
const SLOT_COUNT=FLAT.length;
const FLAT_IX=new Map(FLAT.map((k,i)=>[k,i]));
// Layout fingerprint: a code from a build with a different slot layout must be
// refused, never silently misapplied.
const FINGERPRINT=(()=>{const s=ALL.map(b=>b.id).join(",")+"|"+SLOT_COUNT;
  let h=5381; for(let i=0;i<s.length;i++) h=((h*33)^s.charCodeAt(i))>>>0; return h&0xffff;})();

let checked=new Set(), tab="crafts", season="all";
let backend="—", lastWrite=null, writeCount=0, lastBytes=0, saveBlocked=false, note="";
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const standalone=()=>window.navigator.standalone===true||matchMedia("(display-mode: standalone)").matches;

function parseSet(v){
  try{
    const a=JSON.parse(v);
    if(!Array.isArray(a)) throw new Error("not an array");
    return new Set(a.filter(x=>typeof x==="string"));
  }catch(e){
    // Never silently return empty and let the next tap overwrite good data.
    saveBlocked=true;
    try{ localStorage.setItem(META,JSON.stringify({corrupt:String(v).slice(0,4000),at:Date.now()})); }catch(_){}
    return new Set();
  }
}

async function load(){
  try{ if(window.storage){ const r=await window.storage.get(KEY);
        if(r&&r.value){ backend="window.storage"; return parseSet(r.value); } } }catch(e){}
  try{
    const v=localStorage.getItem(KEY);
    backend="localStorage";
    if(v!=null) return parseSet(v);
  }catch(e){ backend="unavailable"; }
  return new Set();
}

async function save(){
  if(saveBlocked){ renderStatus(); return; }
  const s=JSON.stringify([...checked]); let ok=false;
  try{ if(window.storage){ await window.storage.set(KEY,s); ok=true; backend="window.storage"; } }catch(e){}
  try{ localStorage.setItem(KEY,s); ok=true; if(backend!=="window.storage") backend="localStorage"; }catch(e){}
  if(ok){ lastWrite=new Date(); writeCount++; lastBytes=s.length; }
  else { backend="unavailable"; }
  renderStatus();
}

function renderStatus(){
  const q=document.getElementById("quick");
  if(q) q.innerHTML=(getSyncUrl()?'<button data-act="refresh">Refresh save</button>':"")+
    '<button data-act="importsave">Import save</button>'+
    '<button data-act="storage">Storage &amp; backup</button>';
  const el=document.getElementById("note"); if(!el) return;
  if(flashMsg){ el.textContent=flashMsg; return; }
  if(saveBlocked){
    el.innerHTML='<span class="bad">Not saving</span> — stored progress was unreadable. Open Storage &amp; backup.';
    return;
  }
  if(backend==="unavailable"){
    el.innerHTML='<span class="bad">Saving unavailable</span> — progress will reset when you close this.';
    return;
  }
  const t=lastWrite?lastWrite.toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"not yet";
  const sv=SAVE?` · save ${fmtDate(SAVE.date)}`:"";
  el.textContent=`${checked.size} checked${sv} · saved ${t} · ${backend} · ${standalone()?"home screen":"browser tab"} · build ${BUILD}`;
}

/* ---- backup / restore code -------------------------------------------------
   magic 'S' | version | fingerprint(2) | flags | 17-byte slot bitmap  -> ~30 chars */
const b64u=u8=>btoa(Array.from(u8,c=>String.fromCharCode(c)).join(""))
  .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
function unb64u(s){
  try{
    const t=s.replace(/[^A-Za-z0-9\-_]/g,"").replace(/-/g,"+").replace(/_/g,"/");
    const bin=atob(t), u=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
    return u;
  }catch(e){ return null; }
}
const BITS=Math.ceil(SLOT_COUNT/8);
const toBitmap=set=>{
  const b=new Uint8Array(BITS);
  set.forEach(k=>{const i=FLAT_IX.get(k); if(i!=null) b[i>>3]|=1<<(i&7);});
  return b;
};
const fromBitmap=b=>{
  const s=new Set();
  for(let i=0;i<SLOT_COUNT;i++) if((b[i>>3]>>(i&7))&1) s.add(FLAT[i]);
  return s;
};
// v2 carries manual checks AND, when a save is linked, the donated slots + date,
// so a whole device can be synced by pasting one code. v1 codes still decode.
function encodeCode(set,sv){
  const flags=1|(sv?6:0);
  const out=new Uint8Array(5+BITS+(sv?BITS+4:0));
  out[0]=83; out[1]=2; out[2]=FINGERPRINT&255; out[3]=FINGERPRINT>>8; out[4]=flags;
  let p=5;
  out.set(toBitmap(set),p); p+=BITS;
  if(sv){
    out.set(toBitmap(sv.donated),p); p+=BITS;
    out[p++]=SEASON_IX[sv.date.season]||0;
    out[p++]=sv.date.day&255;
    out[p++]=sv.date.year&255;
    out[p++]=(sv.date.year>>8)&255;
  }
  return b64u(out);
}
function decodeCode(str){
  const b=unb64u(String(str||""));
  if(!b||b.length<5||b[0]!==83) throw new Error("That doesn't look like a code from this app.");
  if(b[1]!==1&&b[1]!==2) throw new Error("That code came from a different version of the app.");
  if((b[2]|(b[3]<<8))!==FINGERPRINT)
    throw new Error("That code was made by a different build. Update the app on both devices, then make a fresh code.");
  if(b[1]===1) return {manual:fromBitmap(b.subarray(5)),save:null};
  const flags=b[4]; let p=5;
  const manual=fromBitmap(b.subarray(p,p+BITS)); p+=BITS;
  let sv=null;
  if(flags&2){
    const donated=fromBitmap(b.subarray(p,p+BITS)); p+=BITS;
    const season=SEASONS[b[p++]]||"spring", day=b[p++], year=b[p]|(b[p+1]<<8);
    sv={date:{season,day,year},donated};
  }
  return {manual,save:sv};
}

/* ---- Stardew save import --------------------------------------------------- */
const SKEY="cc-save-v1";
const XSI="http://www.w3.org/2001/XMLSchema-instance";
let SAVE=null, pendingImport=null;
const SEASON_IX={spring:0,summer:1,fall:2,winter:3};
const fmtDate=d=>d?d.season[0].toUpperCase()+d.season.slice(1)+" "+d.day+", Year "+d.year:"—";

function xfrag(s){
  const doc=new DOMParser().parseFromString('<r xmlns:xsi="'+XSI+'">'+s+'</r>',"application/xml");
  if(doc.querySelector("parsererror")) throw new Error("This file isn't readable as a Stardew save.");
  return doc;
}
function scalar(text,tag){
  const a=text.indexOf("<"+tag+">"); if(a<0) return null;
  const b=text.indexOf("</"+tag+">",a); if(b<0) return null;
  return text.slice(a+tag.length+2,b);
}
/* Owned items, as (itemId -> {quality -> count}).
   The slim sync file ships a pre-aggregated <owned> block; a full save file
   has to be walked instead. */
function parseOwned(text){
  const tally={};
  const add=(id,q,n)=>{ (tally[id]=tally[id]||{})[q]=((tally[id]||{})[q]||0)+n; };

  const oa=text.indexOf("<owned>");
  if(oa>=0){
    const blk=text.slice(oa,text.indexOf("</owned>",oa));
    const re=/<i id="(\d+)" q="(\d+)" n="(\d+)"\/>/g; let m;
    while((m=re.exec(blk))) add(m[1],+m[2],+m[3]);
    return tally;
  }

  // Full save: only <items> blocks are things the player owns. itemsLostLastDeath
  // and itemsFromPlayerToSell are different tag names, so they are excluded here
  // for free. Depth counting handles a chest stored inside a chest.
  let i=0;
  while(true){
    const a=text.indexOf("<items>",i); if(a<0) break;
    let depth=1,p=a+7,close=-1;
    while(p<text.length&&depth>0){
      const o=text.indexOf("<items>",p), c=text.indexOf("</items>",p);
      if(c<0) break;
      if(o>=0&&o<c){ depth++; p=o+7; }
      else { depth--; p=c+8; if(depth===0) close=c+8; }
    }
    if(close<0) break;
    const blk=text.slice(a,close); i=close;
    blk.split("<Item ").forEach(fr=>{
      if(fr.indexOf('xsi:type="Object"')!==0) return;
      const mid=/<itemId>(\d+)<\/itemId>/.exec(fr); if(!mid) return;
      // Numeric ids collide across types: 20 is Leek AND Recycling Machine.
      const mbc=/<bigCraftable>(true|false)<\/bigCraftable>/.exec(fr);
      if(mbc&&mbc[1]==="true") return;
      const mq=/<quality>(\d+)<\/quality>/.exec(fr);
      const ms=/<stack>(\d+)<\/stack>/.exec(fr);
      add(mid[1],mq?+mq[1]:0,ms?+ms[1]:1);
    });
  }
  return tally;
}

/* Generic reader for the flat attribute blocks the sync file emits
   (<inv><i .../></inv>, <quests><q .../></quests>, …). */
const unesc=s=>s.replace(/&lt;/g,"<").replace(/&gt;/g,">")
                .replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,"&");
function attrsOf(s){
  const o={}, re=/([a-zA-Z]+)="([^"]*)"/g; let m;
  while((m=re.exec(s))) o[m[1]]=unesc(m[2]);
  return o;
}
function attrRows(text,wrap,tag){
  const a=text.indexOf("<"+wrap+">"); if(a<0) return null;
  const blk=text.slice(a,text.indexOf("</"+wrap+">",a));
  const re=new RegExp("<"+tag+" ([^>]*?)\\/>","g"), rows=[]; let m;
  while((m=re.exec(blk))) rows.push(attrsOf(m[1]));
  return rows;
}

// Full inventory listing, for browsing/search. Independent of bundle matching.
function parseInv(text){
  const rows=attrRows(text,"inv","i");
  if(!rows) return null;
  return rows.map(r=>({n:r.n,id:r.id,q:+r.q||0,s:+r.s||1,w:r.w,
                       big:r.b==="1",type:r.t||"Object"}));
}

function parseQuests(text){
  const rows=attrRows(text,"quests","q");
  if(!rows) return null;
  return rows.map(r=>({id:r.id,kind:r.k,title:r.t,objective:r.o,desc:r.d,
                       gold:+r.g||0,target:r.tg,item:r.it,need:+r.n||0,
                       done:r.c==="1"}));
}

// Per-slot owned count, honouring each slot's minimum quality (gold >= silver).
function ownedForSlots(tally){
  const out={};
  ALL.forEach(b=>b.items.forEach((it,i)=>{
    if(it.id==null) return;
    const byQ=tally[String(it.id)]; if(!byQ) return;
    const min=it.mq||0;
    let n=0;
    Object.keys(byQ).forEach(q=>{ if(+q>=min) n+=byQ[q]; });
    if(n>0) out[K(b.id,i)]=n;
  }));
  return out;
}

// Pair each save slot to an app item by item id, so slot ORDER never matters.
function pairSlots(items,slots){
  const used=items.map(()=>false);
  return slots.map(s=>{
    for(let i=0;i<items.length;i++){
      if(used[i]) continue;
      const it=items[i];
      const hit = s.id==="-1" ? it.gold!=null : String(it.id)===String(s.id);
      if(hit){ used[i]=true; return i; }
    }
    return -1;
  });
}
function verifyIds(byName){
  const problems=[];
  ALL.forEach(b=>{
    const d=byName[b.name];
    if(!d){ problems.push("no data for "+b.name); return; }
    if(d.required!==b.need) problems.push(b.name+": needs "+d.required+", app says "+b.need);
    if(d.slots.length!==b.items.length) problems.push(b.name+": "+d.slots.length+" slots, app has "+b.items.length);
    pairSlots(b.items,d.slots).forEach((i,j)=>{
      const s=d.slots[j];
      if(i<0){ problems.push(b.name+": nothing matches item id "+s.id); return; }
      if(s.id==="-1") return;
      const it=b.items[i];
      if((it.q||1)!==s.count) problems.push(b.name+"/"+it.n+": qty "+s.count+" vs "+(it.q||1));
      if((it.mq||0)!==s.mq) problems.push(b.name+"/"+it.n+": quality "+s.mq+" vs "+(it.mq||0));
    });
  });
  return {ok:!problems.length,problems};
}

function parseSave(text){
  if(text.indexOf("<SaveGame")<0 && text.indexOf("<bundleData>")<0)
    throw new Error("That doesn't look like a Stardew save. Pick the file with no extension, not SaveGameInfo.");

  const season=scalar(text,"currentSeason"), day=scalar(text,"dayOfMonth"), year=scalar(text,"year");
  if(!season||!day||!year) throw new Error("Couldn't read the in-game date from this file.");

  const bdA=text.indexOf("<bundleData>");
  if(bdA<0) throw new Error("No bundle definitions here — this needs Stardew 1.5 or newer.");
  const bdoc=xfrag(text.slice(bdA,text.indexOf("</bundleData>",bdA)+13));
  const defs={}, byName={};
  Array.prototype.forEach.call(bdoc.getElementsByTagName("item"),el=>{
    const k=el.querySelector("key>string"), v=el.querySelector("value>string");
    if(!k||!v) return;
    const parts=v.textContent.split("/"), toks=parts[2].trim().split(/\s+/), slots=[];
    for(let i=0;i+2<toks.length;i+=3) slots.push({id:toks[i],count:+toks[i+1],mq:+toks[i+2]});
    const d={idx:+k.textContent.split("/").pop(),name:parts[0],slots,
             required:parts[4]&&parts[4].trim()?+parts[4]:slots.length};
    defs[d.idx]=d; byName[d.name]=d;
  });

  const ccA=text.indexOf('<GameLocation xsi:type="CommunityCenter">');
  if(ccA<0) throw new Error("Couldn't find the Community Center in this save.");
  const bA=text.indexOf("<bundles>",ccA);
  if(bA<0) throw new Error("Couldn't find the bundle progress in this save.");
  const sdoc=xfrag(text.slice(bA,text.indexOf("</bundles>",bA)+10));
  const state={};
  Array.prototype.forEach.call(sdoc.getElementsByTagName("item"),el=>{
    const k=el.querySelector("key>int"); if(!k) return;
    state[+k.textContent]=Array.prototype.map.call(
      el.getElementsByTagName("boolean"),x=>x.textContent==="true");
  });

  // Map donated flags onto app slots. Arrays are padded to 3x the slot count —
  // only the first `slots.length` entries mean anything.
  const donated=new Set(); let donatedBundles=0;
  ALL.forEach(b=>{
    const d=byName[b.name]; if(!d) return;
    const bools=state[d.idx]; if(!bools) return;
    const pair=pairSlots(b.items,d.slots);
    let have=0;
    for(let j=0;j<d.slots.length;j++){
      if(!bools[j]) continue;
      have++;
      if(pair[j]>=0) donated.add(K(b.id,pair[j]));
    }
    if(have>=d.required) donatedBundles++;
  });

  const untracked=Object.keys(defs).map(i=>defs[i].name).filter(n=>!ALL.some(b=>b.name===n));

  // Independent cross-check: our per-room totals must agree with <areasComplete>.
  let areaMismatch="", areaFlags=null;
  const ac=scalar(text,"areasComplete");
  if(ac){
    const flags=(ac.match(/<boolean>(true|false)<\/boolean>/g)||[]).map(x=>x.indexOf("true")>0);
    areaFlags=flags;
    const order=["pantry","crafts","fishtank","boiler","vault","bulletin"];
    const bad=[];
    order.forEach((rid,i)=>{
      const bs=ALL.filter(b=>b.roomId===rid);
      const done=bs.every(b=>{
        const d=byName[b.name], bools=d&&state[d.idx];
        if(!d||!bools) return false;
        let c=0; for(let j=0;j<d.slots.length;j++) if(bools[j]) c++;
        return c>=d.required;
      });
      if(flags[i]!=null && flags[i]!==done) bad.push(rid);
    });
    if(bad.length) areaMismatch="disagrees on "+bad.join(", ");
  }

  const owned=ownedForSlots(parseOwned(text));
  const inv=parseInv(text);
  const quests=parseQuests(text);
  const social=parseSocial(text);
  const col=parseCol(text);
  const machines=parseMachines(text);
  const animals=parseAnimals(text);

  return {v:1,at:Date.now(),src:"file",
          date:{season:season,day:+day,year:+year},
          money:+(scalar(text,"money")||0), farm:scalar(text,"farmName")||"",
          donated,donatedBundles,untracked,areaMismatch,areas:areaFlags,owned,inv,quests,social,col,machines,animals,
          ownedCount:Object.keys(owned).length,
          verify:verifyIds(byName)};
}

/* Sync URL lives only in this device's storage — never in the repo. */
const UKEY="cc-syncurl-v1";
const getSyncUrl=()=>{ try{ return localStorage.getItem(UKEY)||""; }catch(e){ return ""; } };
const setSyncUrl=u=>{ try{ u?localStorage.setItem(UKEY,u):localStorage.removeItem(UKEY); }catch(e){} };

async function refreshFromUrl(){
  const url=getSyncUrl();
  if(!url) throw new Error("No sync link saved yet.");
  let res;
  try{
    // cache-bust so a refresh always sees the newest publish
    res=await fetch(url+(url.indexOf("?")<0?"?":"&")+"t="+Date.now(),{cache:"no-store"});
  }catch(e){
    throw new Error("Couldn't reach the sync link. Check the connection, or that the link is still valid.");
  }
  if(!res.ok) throw new Error("The sync link returned "+res.status+". Has the gist been deleted?");
  const text=await res.text();
  const r=parseSave(text);
  return adoptSave(r,"url");
}

/* Every field SAVE carries, in ONE place. Adding a field to some of the
   construction sites but not the persist list is the classic "works after
   Refresh, empty after relaunch" bug — so both are driven from this list. */
const SAVE_FIELDS=["date","money","farm","donatedBundles","verified","areas",
                   "owned","inv","quests","orders","col","social","machines","animals"];

function adoptSave(r,src){
  const s={v:1,at:r.at||Date.now(),src:src||r.src||"file",
           donated:r.donated instanceof Set?r.donated:new Set(r.donated||[])};
  SAVE_FIELDS.forEach(k=>{ s[k]=r[k]!==undefined?r[k]:null; });
  if(s.verified===null) s.verified=r.verify?r.verify.ok:true;
  if(!s.owned) s.owned={};
  SAVE=s;
  persistSave();
  return SAVE;
}

function persistSave(){
  try{
    if(SAVE){
      const o={v:SAVE.v,at:SAVE.at,src:SAVE.src,donated:[...SAVE.donated]};
      SAVE_FIELDS.forEach(k=>{ o[k]=SAVE[k]!==undefined?SAVE[k]:null; });
      localStorage.setItem(SKEY,JSON.stringify(o));
    } else localStorage.removeItem(SKEY);
  }catch(e){}
}
function loadSaveState(){
  try{
    const v=localStorage.getItem(SKEY); if(!v) return null;
    const o=JSON.parse(v); o.donated=new Set(o.donated||[]); return o;
  }catch(e){ return null; }
}

/* Display state = manual checks UNION what the save says is already donated. */
const isOn=k=>checked.has(k)||(!!SAVE&&SAVE.donated.has(k));
const ownedQty=k=>(SAVE&&SAVE.owned&&SAVE.owned[k])||0;

/* ---- deadline engine -------------------------------------------------------
   Stardew seasons are 28 days. A crop must be planted by day 28-growth to
   finish, and seasonal forage/fish vanish when the season turns. */
const SEASON_LEN=28;
const absDay=d=>(d.year-1)*112+SEASON_IX[d.season]*28+(d.day-1);
const daysLeftInSeason=d=>SEASON_LEN-d.day+1;

// Days from `d` until `season` next begins (0 if we are in it now).
function daysUntilSeason(d,season){
  const want=SEASON_IX[season], cur=SEASON_IX[d.season];
  if(want===cur) return 0;
  let steps=(want-cur+4)%4;
  return daysLeftInSeason(d)+(steps-1)*SEASON_LEN;
}

// What the player should know about one slot, right now.
function slotUrgency(b,it,i,d){
  const key=K(b.id,i);
  if(isOn(key)) return null;
  const greenhouse=!!(SAVE&&SAVE.areas&&SAVE.areas[0]);
  const seasons=it.s||null;
  const out={key,bundle:b,item:it,idx:i,rank:9,msg:"",tag:""};

  // Something you own and can hand in today outranks everything else.
  const have=ownedQty(key);
  if(have>=(it.q||1)){ out.rank=0; out.tag="ready"; out.msg="you have "+have; return out; }

  if(it.tree){
    const wait=daysUntilSeason(d,it.tree);
    out.rank=5; out.tag="tree";
    out.msg=wait===0?"in season now — a tree planted today fruits next "+it.tree
                    :"fruits in "+it.tree+", "+wait+"d away · trees need 28d to grow";
    if(have>0) out.msg="have "+have+"/"+(it.q||1)+" · "+out.msg;
    return out;
  }

  if(it.g){
    const canPlantNow=seasons&&seasons.indexOf(d.season)>=0;
    if(canPlantNow){
      const last=SEASON_LEN-it.g;
      const left=last-d.day;
      if(greenhouse){ out.rank=4; out.tag="grow"; out.msg="greenhouse — plant any time ("+it.g+"d)"; }
      else if(left<0){ out.rank=6; out.tag="late"; out.msg="too late this "+d.season+" — needs "+it.g+"d"; }
      else { out.rank=left<=3?1:2; out.tag="plant";
             out.msg="plant by "+d.season+" "+last+(left===0?" — today!":" ("+left+"d left)"); }
    } else {
      const nxt=(seasons||[]).map(s=>daysUntilSeason(d,s)).sort((a,b)=>a-b)[0];
      out.rank=greenhouse?4:7; out.tag="wait";
      out.msg=greenhouse?"greenhouse — plant any time":"plantable in "+(nxt||0)+"d";
    }
    if(have>0) out.msg="have "+have+"/"+(it.q||1)+" · "+out.msg;
    return out;
  }

  if(seasons){
    if(seasons.indexOf(d.season)>=0){
      const left=daysLeftInSeason(d);
      out.rank=left<=7?1:3; out.tag="leaving";
      out.msg="in season — "+left+" day"+(left===1?"":"s")+" left";
    } else {
      const nxt=seasons.map(s=>daysUntilSeason(d,s)).sort((a,b)=>a-b)[0];
      out.rank=8; out.tag="gone"; out.msg="out of season — back in "+nxt+"d";
    }
    if(have>0) out.msg="have "+have+"/"+(it.q||1)+" · "+out.msg;
    return out;
  }

  out.rank=have>0?3:9; out.tag=have>0?"partial":"any";
  out.msg=have>0?"have "+have+"/"+(it.q||1):(it.h||"available year-round");
  return out;
}

function allUrgencies(){
  if(!SAVE) return [];
  const d=SAVE.date, rows=[];
  ALL.forEach(b=>{
    if(stat(b).done) return;
    b.items.forEach((it,i)=>{ const u=slotUrgency(b,it,i,d); if(u) rows.push(u); });
  });
  return rows.sort((a,b)=>a.rank-b.rank||a.bundle.name.localeCompare(b.bundle.name));
}
const stat=b=>{const have=b.items.filter((_,i)=>isOn(K(b.id,i))).length;return{have,done:have>=b.need};};
const roomProg=id=>{const bs=ALL.filter(b=>b.roomId===id);return{done:bs.filter(b=>stat(b).done).length,total:bs.length};};

/* Two-level nav: a mode row, then that mode's tabs. Twelve flat chips is
   unusable on a phone. `tab` stays the single source of truth; mode is derived. */
const MODES=[
  {id:"today", label:"Today",   tabs:["now"]},
  {id:"cc",    label:"Bundles", tabs:["inv","crafts","pantry","fishtank","boiler","bulletin","vault","needed"]},
  {id:"town",  label:"Town",    tabs:["quests","people"]},
  {id:"coll",  label:"Collections", tabs:["mus","min","arch","ship","fishc","cook"]}
];
const MODE_OF={}; MODES.forEach(m=>m.tabs.forEach(t=>MODE_OF[t]=m.id));
const lastTab={today:"now", cc:"crafts", town:"quests", coll:"mus"};

const chip=(attr,val,label,cur,extra)=>
  '<button class="needed" data-'+attr+'="'+val+'" aria-current="'+cur+'" style="background:'+
  (cur?"var(--ink)":"transparent")+';color:'+(cur?"var(--plaque)":"var(--ink)")+
  (extra||"")+'">'+label+'</button>';

function modeBadge(id){
  if(id==="today"){
    if(!SAVE) return "";
    let n=allUrgencies().filter(u=>u.tag==="ready"||u.tag==="plant"||u.tag==="leaving").length;
    if(SAVE.machines) n+=SAVE.machines.length;
    if(SAVE.animals)  n+=SAVE.animals.filter(a=>!a.petted||a.produce).length;
    return n?' <span class="n">'+n+'</span>':'';
  }
  if(id==="cc") return ' <span class="n">'+ALL.filter(b=>stat(b).done).length+'/'+ALL.length+'</span>';
  if(id==="coll"){
    const c=SAVE&&SAVE.col;
    return c?' <span class="n">'+c.mus.length+'/95</span>':'';
  }
  if(id==="town"){
    const qs=(SAVE&&SAVE.quests)||[], have=invById();
    let n=qs.filter(q=>q.done||(q.kind==="D"&&(have[q.item]||0)>=q.need)).length;
    if(SAVE&&SAVE.social) n+=SAVE.social.filter(p=>BDAY[p.name]&&untilBday(BDAY[p.name])<=1).length;
    return n?' <span class="n">'+n+'</span>':'';
  }
  return "";
}

function renderNavMode(){
  const el=document.getElementById("navmode"); if(!el) return;
  const cur=MODE_OF[tab]||"cc";
  el.innerHTML=MODES.map(m=>chip("mode",m.id,m.label+modeBadge(m.id),cur===m.id,
    m.id==="today"?";border-color:#c9a227":"")).join("");
}

function renderNav(){
  document.getElementById("score").innerHTML=
    ALL.filter(b=>stat(b).done).length+'<span>/'+ALL.length+'</span>';
  renderNavMode();
  const mode=MODES.find(m=>m.id===(MODE_OF[tab]||"cc"))||MODES[1];
  const el=document.getElementById("nav");
  const tabs=mode.tabs.filter(t=>t!=="inv"||SAVE);   // What I own needs a linked save
  el.style.display=tabs.length>1?"flex":"none";
  el.innerHTML=tabs.map(t=>{
    const r=ROOMS.find(x=>x.id===t);
    if(r){
      const p=roomProg(r.id),full=p.done===p.total;
      return '<button data-tab="'+r.id+'" data-full="'+(full?1:0)+'" aria-current="'+(tab===r.id)+
        '" style="border-color:'+r.color+';background:'+(full?r.color:"transparent")+'">'+
        r.name+' <span class="n">'+p.done+'/'+p.total+'</span></button>';
    }
    const LABEL={inv:"What I own",needed:"Still needed",now:"Right now",
                 quests:"Quests",orders:"Special orders",people:"Villagers",
                 mus:"Museum",min:"Minerals",arch:"Artifacts",
                 ship:"Shipping",fishc:"Fish",cook:"Cooking"};
    return chip("tab",t,LABEL[t]||t,tab===t,"");
  }).join("");
}

function bundleCard(b,color){
  const st=stat(b), short=Math.max(0,b.need-st.have), partial=b.need<b.items.length;
  const sub=st.done?(b.reward?"Reward: "+b.reward:"Complete")
    :(partial?"Any "+short+" more of these "+b.items.length:short+" to go")+(b.note?" · "+b.note:"");
  const slots=b.items.map((it,i)=>{
    const id=K(b.id,i),on=isOn(id),don=!!SAVE&&SAVE.donated.has(id);
    let hint=it.h||"";
    if(don) hint="donated";
    else if(on&&SAVE) hint="not donated yet"+(it.h?" · "+it.h:"");
    else { const hv=ownedQty(id);
           if(hv) hint="have "+hv+(hv>=(it.q||1)?" — ready":" of "+(it.q||1))+(it.h?" · "+it.h:""); }
    return '<button class="slot'+(st.done&&!on?" moot":"")+(don?" donated":"")+'" data-id="'+id+'" aria-pressed="'+on+'">'+
      '<span class="name">'+(on?"✓ ":"")+esc(it.n)+(it.q?'<span class="qty"> ×'+it.q+'</span>':"")+'</span>'+
      (hint?'<span class="hint">'+esc(hint)+'</span>':"")+'</button>';
  }).join("");
  return '<div class="bundle" style="border:4px solid '+(st.done?"var(--done)":color)+'">'+
    '<div class="bhead" style="background:'+(st.done?"var(--done)":color)+'"><span>'+(st.done?"✓ ":"")+esc(b.name)+'</span>'+
    '<span class="c">'+Math.min(st.have,b.need)+'/'+b.need+'</span></div>'+
    '<div class="bbody"><div class="sub">'+esc(sub)+'</div><div class="slots">'+slots+'</div></div></div>';
}

function parseMachines(text){
  const rows=attrRows(text,"machines","m");
  return rows?rows.map(r=>({machine:r.n,held:r.h||""})):null;
}
function parseAnimals(text){
  const rows=attrRows(text,"animals","a");
  return rows?rows.map(r=>({name:r.n,type:r.ty,building:r.b,
    friend:+r.f||0,happy:+r.h||0,full:+r.fu||0,
    produce:r.p||"",petted:r.pet==="1"})):null;
}

/* The chores half of Today: things that reset daily and are easy to forget. */
function choresHtml(){
  let html="";
  const mach=SAVE.machines, ani=SAVE.animals;

  if(mach&&mach.length){
    const byMachine={};
    mach.forEach(m=>{ (byMachine[m.machine]=byMachine[m.machine]||[]).push(m.held); });
    html+='<h3>Ready to collect ('+mach.length+')</h3>';
    html+=Object.keys(byMachine).sort().map(k=>{
      const items=byMachine[k].filter(Boolean);
      const uniq=[...new Set(items)];
      return '<div class="need urg-ready" style="border-left:4px solid #5d8c2f">'+
        '<div class="t">'+esc(k)+' <span class="m">×'+byMachine[k].length+'</span></div>'+
        (uniq.length?'<div class="items"><i>'+esc(uniq.join(", "))+'</i></div>':"")+
        '</div>';
    }).join("");
  }

  if(ani&&ani.length){
    const unpetted=ani.filter(a=>!a.petted);
    const withProduce=ani.filter(a=>a.produce);
    const hungry=ani.filter(a=>a.full===0);
    html+='<h3>Animals ('+ani.length+')</h3>';
    if(unpetted.length)
      html+='<div class="need urg-plant" style="border-left:4px solid #c9a227">'+
        '<div class="t">'+unpetted.length+' not petted today</div>'+
        '<div class="items"><i>'+esc(unpetted.map(a=>a.name).join(", "))+'</i></div></div>';
    if(withProduce.length)
      html+='<div class="need urg-ready" style="border-left:4px solid #5d8c2f">'+
        '<div class="t">'+withProduce.length+' with produce waiting</div>'+
        '<div class="items"><i>'+esc(withProduce.map(a=>
          a.name+" — "+itemName(a.produce)).join(", "))+'</i></div></div>';
    if(hungry.length)
      html+='<div class="need urg-leaving" style="border-left:4px solid #c4552e">'+
        '<div class="t">'+hungry.length+' unfed</div>'+
        '<div class="items"><i>'+esc(hungry.map(a=>a.name).join(", "))+
        '</i> · no grass in winter, so they need hay in the trough</div></div>';
    if(!unpetted.length&&!withProduce.length&&!hungry.length)
      html+='<p>All petted, fed, and nothing waiting.</p>';
  }

  // Birthdays and turn-in-ready quests belong on Today too.
  if(SAVE.social){
    const bd=SAVE.social.filter(p=>BDAY[p.name]&&untilBday(BDAY[p.name])<=1);
    if(bd.length) html+='<h3>Birthdays</h3>'+bd.map(p=>
      '<div class="need urg-ready" style="border-left:4px solid #5d8c2f">'+
      '<div class="t">'+esc(p.name)+'</div><div class="items"><i>'+
      (untilBday(BDAY[p.name])===0?"Birthday today":"Birthday tomorrow")+
      (p.talked?"":" · not spoken to yet")+'</i></div></div>').join("");
  }
  if(SAVE.quests){
    const have=invById();
    const ready=SAVE.quests.filter(q=>q.done||(q.kind==="D"&&(have[q.item]||0)>=q.need));
    if(ready.length) html+='<h3>Quests ready</h3>'+ready.map(q=>
      '<div class="need urg-ready" style="border-left:4px solid #5d8c2f">'+
      '<div class="t">'+esc(q.title)+'</div><div class="items"><i>'+
      (q.done?"Completed — hand it in"+(q.target?" to "+esc(q.target):"")
             :"You have what "+esc(q.target)+" needs")+'</i></div></div>').join("");
  }
  return html;
}

function renderNow(){
  if(!SAVE) return '<section class="plaque panel"><h2>Right now</h2>'+
    '<p>Link your save and this becomes a live to-do list: what you already own, '+
    'what is about to leave with the season, and what must be planted today.</p>'+
    '<button data-act="importsave">Import a save</button></section>';

  const d=SAVE.date, rows=allUrgencies();
  const groups={}; rows.forEach(r=>{ (groups[r.tag]=groups[r.tag]||[]).push(r); });
  const left=daysLeftInSeason(d);

  let html='<section class="plaque panel"><h2>Right now</h2>'+
    '<p class="kv">'+esc(fmtDate(d))+' · <b style="min-width:0">'+left+' day'+(left===1?"":"s")+
    ' left in '+esc(d.season)+'</b></p>'+choresHtml();

  let shown=0;
  TAGORDER.forEach(tag=>{
    const g=groups[tag]; if(!g||!g.length) return;
    if(tag==="gone"||tag==="wait"||tag==="any") return;   // not actionable today
    shown++;
    html+='<h3>'+esc(TAGS[tag][0])+'</h3><p>'+esc(TAGS[tag][1])+'</p>';
    html+=g.map(r=>'<div class="need urg-'+tag+'" style="border-left:4px solid '+r.bundle.color+'">'+
      '<div class="t">'+esc(r.item.n)+(r.item.q?'<span class="qty"> ×'+r.item.q+'</span>':"")+
        ' <span class="m">'+esc(r.bundle.name)+' · '+esc(r.bundle.roomName)+'</span></div>'+
      '<div class="items"><i>'+esc(r.msg)+'</i></div></div>').join("");
  });
  if(!shown) html+='<p>Nothing urgent. Everything left is out of season or has no deadline.</p>';

  const rest=(groups.gone||[]).length+(groups.wait||[]).length+(groups.any||[]).length;
  if(rest) html+='<h3>Not yet</h3><p>'+rest+' more slot'+(rest===1?"":"s")+
    ' are out of season or have no deadline — see Still needed.</p>';
  return html+'</section>';
}

function untilBday(code){
  const mine=dayIx(SEASON_IX[SAVE.date.season],SAVE.date.day);
  return (dayIx(+code[0],+code.slice(1))-mine+112)%112;
}
const bdayText=c=>["spring","summer","fall","winter"][+c[0]]+" "+(+c.slice(1));

function parseCol(text){
  const m=/<col ([^>]*?)\/>/.exec(text); if(!m) return null;
  const a=attrsOf(m[1]);
  const run=s=>s?s.split(" ").filter(Boolean):[];
  return {ship:run(a.ship),fish:run(a.fish),min:run(a.min),arch:run(a.arch),
          mus:run(a.mus),cooked:run(a.cooked),
          cookknown:a.cookknown?a.cookknown.split("|"):[],
          craftmade:a.craftmade?a.craftmade.split("|"):[],
          craftknown:+a.craftknown||0};
}

function parseSocial(text){
  const rows=attrRows(text,"social","f");
  if(!rows) return null;
  return rows.map(r=>({name:r.n,pts:+r.p||0,giftsWeek:+r.gw||0,giftsToday:+r.gt||0,
                       talked:r.t==="1",status:r.st||"Friendly"}));
}

/* Collections. Only the museum halves have a defensible denominator today —
   Minerals 53 + Artifacts 42 = 95 exactly. Shipping/fish/cooking are shown as
   raw progress, with no total, rather than inventing one. */
const COLLECTIONS=[
  {id:"mus",  label:"Museum",    have:c=>c.mus,  all:()=>COLIDS.mus,  total:95},
  {id:"min",  label:"Minerals",  have:c=>c.min,  all:()=>COLIDS.min,  total:53},
  {id:"arch", label:"Artifacts", have:c=>c.arch, all:()=>COLIDS.arch, total:42},
  {id:"ship", label:"Shipping",  have:c=>c.ship, all:()=>null},
  {id:"fishc",label:"Fish",      have:c=>c.fish, all:()=>null},
  {id:"cook", label:"Cooking",   have:null,      all:()=>null}
];
let colQ="";

function colRows(def,c){
  const have=new Set(def.have?def.have(c):[]);
  const all=def.all?def.all():null;
  const q=colQ.trim().toLowerCase();
  const rows=[];
  if(all){
    all.forEach(id=>rows.push({id,name:itemName(id),got:have.has(id)}));
    // Anything donated that isn't in our list still deserves a row.
    have.forEach(id=>{ if(all.indexOf(id)<0) rows.push({id,name:itemName(id),got:true,extra:true}); });
  } else {
    have.forEach(id=>rows.push({id,name:itemName(id),got:true}));
  }
  return rows.filter(r=>!q||r.name.toLowerCase().indexOf(q)>=0)
             .sort((a,b)=>(a.got-b.got)||a.name.localeCompare(b.name));
}

    '<button data-act="refresh">Refresh save</button></section>';

  if(def.id==="cook"){
    return '<section class="plaque panel"><h2>Cooking</h2>'+
      '<div class="kv"><b>recipes known</b>'+c.cookknown.length+'<br>'+
      '<b>cooked at least once</b>'+c.cooked.length+'<br>'+
      '<b>crafting recipes</b>'+c.craftmade.length+' of '+c.craftknown+' known made</div>'+

      (def.total?' · '+missing+' still missing':'')+'</p>'+
    (def.total?'':'<p>No completion total is shown here — the game\'s list needs '+
      'reference data I have not been able to verify, so a denominator would be a guess.</p>')+
    '<input id="colq" type="search" placeholder="Search '+esc(def.label.toLowerCase())+'" value="'+esc(colQ)+'">'+
    '<div id="collist">'+colListHtml(rows)+'</div></section>';

      '</i></div></div>';
  }).join("");

/* Quest deliveries accept ANY quality, so they join against the raw inventory —
   not SAVE.owned, which is already collapsed to bundle slots and quality-filtered. */
function invById(){
  const m={};
  (SAVE&&SAVE.inv||[]).forEach(r=>{
    if(r.big||r.type!=="Object") return;   // id 20 is Leek AND Recycling Machine
    m[r.id]=(m[r.id]||0)+r.s;
  });
  return m;
}
function questWhere(id){
  const hits=(SAVE&&SAVE.inv||[]).filter(r=>r.id===id&&!r.big&&r.type==="Object");
  if(!hits.length) return "";
  return hits.map(r=>r.s+" in "+r.w).join(", ");
}

function renderQuests(){
  if(!SAVE) return '<section class="plaque panel"><h2>Quests</h2>'+
    '<p>Link your save to see your active quests.</p>'+
    '<button data-act="importsave">Import a save</button></section>';
  const qs=SAVE.quests;
  if(!qs) return '<section class="plaque panel"><h2>Quests</h2>'+
    '<p>This save was linked before quests were included. Tap <b>Refresh save</b>.</p>'+
    '<button data-act="refresh">Refresh save</button></section>';
  if(!qs.length) return '<section class="plaque panel"><h2>Quests</h2>'+
    '<p>No active quests. Check the board outside Pierre\'s.</p></section>';

  const have=invById();
  const rank=q=>{
    if(q.done) return 0;
    if(q.kind==="D"&&(have[q.item]||0)>=q.need) return 1;
    if(q.kind==="D") return 2;
    return 3;
  };
  const rows=qs.slice().sort((a,b)=>rank(a)-rank(b));

  return '<section class="plaque panel"><h2>Quests</h2>'+
    '<p class="kv">'+qs.length+' active · '+esc(fmtDate(SAVE.date))+'</p>'+
    rows.map(q=>{
      const r=rank(q);
      const cls=r===0?"urg-ready":r===1?"urg-ready":r===2?"urg-plant":"";
      let line;
      if(q.done) line="<b>Completed — go and hand it in"+(q.target?" to "+esc(q.target):"")+"</b>";
      else if(q.kind==="D"){
        const n=have[q.item]||0;
        line=n>=q.need
          ? "<b>You have "+n+" — deliver "+q.need+" to "+esc(q.target)+"</b> · "+esc(questWhere(q.item))
          : "Need "+q.need+", you have "+n+(n?" · "+esc(questWhere(q.item)):"");
      } else line=esc(q.objective||"");
      return '<div class="need '+cls+'" style="border-left:4px solid '+
        (r<=1?"#5d8c2f":r===2?"#c9a227":"#b09468")+'">'+
        '<div class="t">'+esc(q.title)+
          (q.gold?' <span class="m">'+q.gold+'g</span>':"")+'</div>'+
        '<div class="items">'+esc(q.objective||"")+'</div>'+
        '<div class="items"><i>'+line+'</i></div></div>';
    }).join("")+
    '</section>';
}

let invQ="";
// Which bundles (if any) still want this item id.
function wantedBy(id){
  const out=[];
  ALL.forEach(b=>{
    if(stat(b).done) return;
    b.items.forEach((it,i)=>{
      if(String(it.id)!==String(id)) return;
      if(isOn(K(b.id,i))) return;
      out.push(b.name);
    });
  });
  return out;
}

function invRows(){
  if(!SAVE||!SAVE.inv) return null;
  const q=invQ.trim().toLowerCase();
  const rows=SAVE.inv.filter(r=>!q||r.n.toLowerCase().indexOf(q)>=0);
  // fold identical name+quality+container into one line
  const seen={},out=[];
  rows.forEach(r=>{
    const k=r.n+"|"+r.q+"|"+r.w;
    if(seen[k]){ seen[k].s+=r.s; return; }
    seen[k]={...r}; out.push(seen[k]);
  });
  return out.sort((a,b)=>a.n.localeCompare(b.n)||a.w.localeCompare(b.w));
}

function renderNeeded(){
  const filters=[["all","Everything"]].concat(SEASONS.map(s=>[s,s[0].toUpperCase()+s.slice(1)]),[["any","Year-round"]]);
  const rows=[];
  for(const b of ALL){
    const st=stat(b); if(st.done) continue;
    const items=b.items.map((it,i)=>({...it,_k:K(b.id,i)})).filter(it=>!isOn(it._k))
      .filter(it=>season==="all"||(season==="any"?!it.s:(it.s||[]).includes(season)));
    if(items.length) rows.push({b,items,short:b.need-st.have});
  }
  const allDone=ALL.every(b=>stat(b).done);
  return '<section class="plaque needwrap"><h2>What\'s still missing</h2><div class="filters">'+
    filters.map(f=>'<button data-season="'+f[0]+'" aria-pressed="'+(season===f[0])+'">'+f[1]+'</button>').join("")+'</div>'+
    (rows.length?rows.map(r=>'<div class="need" style="border-left:4px solid '+r.b.color+'">'+
      '<div class="t">'+esc(r.b.name)+' <span class="m">'+esc(r.b.roomName)+' · need '+r.short+' more</span></div>'+
      '<div class="items">'+r.items.map(it=>esc(it.n)+(it.q?'<span class="qty"> ×'+it.q+'</span>':"")).join('<i> · </i>')+'</div></div>').join("")
     :'<p>'+(allDone?"Every bundle is complete. The Junimos are done here.":"Nothing left for this season — switch the filter to see the rest.")+'</p>')+
    '</section>';
}

async function handleFile(f){
  const box=()=>document.getElementById("importmsg");
  if(!f||!box()) return;
  box().innerHTML='<p>Reading '+esc(f.name)+' ('+Math.round(f.size/1024)+" KB) …</p>";
  try{
    const text=await f.text();
    const r=parseSave(text);
    pendingImport=r;
    box().innerHTML='<div class="kv">'+
        '<b>farm</b>'+esc(r.farm||"—")+'<br>'+
        '<b>in-game date</b>'+esc(fmtDate(r.date))+'<br>'+
        '<b>gold</b>'+r.money+'<br>'+
        '<b>bundles donated</b>'+r.donatedBundles+' / '+ALL.length+'<br>'+
        '<b>slots donated</b>'+r.donated.size+'<br>'+
        '<b>item check</b>'+(r.verify.ok?'<span class="ok">passed</span>'
          :'<span class="bad">'+r.verify.problems.length+' problems</span>')+'<br>'+
        '<b>cross-check</b>'+(r.areaMismatch?'<span class="bad">'+esc(r.areaMismatch)+'</span>'
          :'<span class="ok">agrees with the game</span>')+
      '</div>'+
      (r.verify.ok?"":'<div class="warn">'+esc(r.verify.problems.slice(0,4).join(" · "))+'</div>')+
      (r.untracked.length?'<div class="warn">This app doesn\'t track: '+esc(r.untracked.join(", "))+'</div>':'')+
      '<button data-act="apply">Apply this save</button>';
  }catch(err){
    box().innerHTML='<p class="bad">'+esc(err.message)+'</p>';
  }
}

function render(){
  renderNav();
  const main=document.getElementById("main");
  if(tab==="now"){ main.innerHTML=renderNow(); renderStatus(); return; }
  if(tab==="inv"){ main.innerHTML=renderInv(); renderStatus(); return; }
  if(tab==="quests"){ main.innerHTML=renderQuests(); renderStatus(); return; }
  if(tab==="people"){ main.innerHTML=renderPeople(); renderStatus(); return; }
  if(COLLECTIONS.some(c=>c.id===tab)){ main.innerHTML=renderCollections(); renderStatus(); return; }
  if(tab==="import"){ main.innerHTML=renderImport(); renderStatus(); return; }
  if(tab==="storage"){ main.innerHTML=renderStorage(); renderStatus(); return; }
  if(tab==="needed"){ main.innerHTML=renderNeeded(); renderStatus(); return; }
  const r=ROOMS.find(x=>x.id===tab);
  if(!r){ tab="now"; return render(); }
  main.innerHTML='<div class="roomhead"><h2 style="color:'+r.color+'">'+esc(r.name)+'</h2><p>'+esc(r.unlocks)+'</p></div>'+
    '<div class="grid">'+r.bundles.map(b=>bundleCard(b,r.color)).join("")+'</div>';
  renderStatus();
}

const ACTIONS={
  storage(){ tab="storage"; render(); window.scrollTo(0,0); },
  importsave(){ tab="import"; render(); window.scrollTo(0,0); },
  apply(){
    if(!pendingImport) return;
    const r=pendingImport;
    adoptSave(r,r.src||"file");
    pendingImport=null;
    tab="now"; render(); window.scrollTo(0,0);
    flash("Imported "+fmtDate(SAVE.date)+" · "+SAVE.donatedBundles+" bundles already donated.");
  },
  unlink(){
    if(!confirm("Unlink the save? Your own checkmarks stay put.")) return;
    SAVE=null; persistSave(); render();
  },
  savedurl(){
    const el=document.getElementById("syncurl"); if(!el) return;
    const u=el.value.trim();
    if(u&&!/^https:\/\//i.test(u)){
      document.getElementById("syncmsg").innerHTML='<p class="bad">The link must start with https://</p>';
      return;
    }
    setSyncUrl(u); render();
    const m=document.getElementById("syncmsg");
    if(m) m.innerHTML='<p class="ok">'+(u?"Link saved. Tap Refresh now.":"Link cleared.")+'</p>';
  },
  async refresh(){
    const m=()=>document.getElementById("syncmsg");
    if(m()) m().innerHTML="<p>Fetching…</p>";
    try{
      const s=await refreshFromUrl();
      tab="now"; render(); window.scrollTo(0,0);
      flash("Synced "+fmtDate(s.date)+" · "+s.donatedBundles+" bundles donated.");
    }catch(err){ if(m()) m().innerHTML='<p class="bad">'+esc(err.message)+'</p>'; }
  },
  canary(){
    try{
      const k="cc-canary", v=String(Date.now());
      localStorage.setItem(k,v);
      const back=localStorage.getItem(k);
      localStorage.removeItem(k);
      canary = back===v ? "wrote and read back OK" : "read back the wrong value";
    }catch(e){ canary="FAILED: "+e.name; }
    render();
  },
  persist(){
    if(!navigator.storage||!navigator.storage.persist){ persisted="not supported here"; render(); return; }
    navigator.storage.persist().then(g=>{ persisted=g?"granted":"denied"; render(); });
  },
  copy(){
    const el=document.getElementById("codeout"); if(!el) return;
    el.select(); el.setSelectionRange(0,999);
    const done=()=>{ const b=document.querySelector('[data-act="copy"]'); if(b) b.textContent="Copied"; };
    if(navigator.clipboard) navigator.clipboard.writeText(el.value).then(done,()=>{try{document.execCommand("copy");done();}catch(e){}});
    else { try{ document.execCommand("copy"); done(); }catch(e){} }
  },
  restore(){
    const el=document.getElementById("codein"), msg=document.getElementById("restoremsg");
    try{
      const r=decodeCode(el.value);
      checked=r.manual; saveBlocked=false;
      let extra="";
      if(r.save){
        adoptSave({at:Date.now(),date:r.save.date,money:0,farm:"",
                   donated:r.save.donated,donatedBundles:0,verified:true},"code");
        SAVE.donatedBundles=ALL.filter(b=>{
          let c=0; b.items.forEach((_,i)=>{ if(SAVE.donated.has(K(b.id,i))) c++; });
          return c>=b.need;
        }).length;
        persistSave();
        extra=" · save "+fmtDate(SAVE.date)+", "+SAVE.donatedBundles+" bundles donated";
      }
      save(); tab=SAVE?"now":"crafts"; render(); window.scrollTo(0,0);
      flash("Restored "+r.manual.size+" checks"+extra+".");
    }catch(err){ if(msg) msg.innerHTML='<p class="bad">'+esc(err.message)+'</p>'; }
  },
  unblock(){ saveBlocked=false; try{ localStorage.removeItem(META); }catch(e){} save(); render(); },
  clear(){
    if(!confirm("Clear every check? Make a backup code first if you might want this back.")) return;
    checked=new Set(); saveBlocked=false; save(); render();
  }
};

document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.act){ const fn=ACTIONS[t.dataset.act]; if(fn) fn(); return; }
  if(t.dataset.mode){ tab=lastTab[t.dataset.mode]; render(); window.scrollTo(0,0); return; }
  if(t.dataset.tab){
    tab=t.dataset.tab;
    lastTab[MODE_OF[tab]||"cc"]=tab;
    render(); window.scrollTo(0,0); return;
  }
  if(t.dataset.season){ season=t.dataset.season; render(); return; }
  if(t.dataset.id){
    const k=t.dataset.id;
    if(SAVE&&SAVE.donated.has(k)){ flash("The Junimos already have this one."); return; }
    checked.has(k)?checked.delete(k):checked.add(k); save(); render(); return;
  }
});

document.addEventListener("change",e=>{
  if(e.target&&e.target.id==="savefile") handleFile(e.target.files&&e.target.files[0]);
});

// Re-render only the results; a full render() would blow away focus on each key.
document.addEventListener("input",e=>{
  if(e.target&&e.target.id==="invq"){
    invQ=e.target.value;
    const list=document.getElementById("invlist");
    if(list) list.innerHTML=invListHtml(invRows());
  }
  if(e.target&&e.target.id==="colq"){
    colQ=e.target.value;
    const list=document.getElementById("collist");
    const def=COLLECTIONS.find(x=>x.id===tab)||COLLECTIONS[0];
    if(list&&SAVE&&SAVE.col) list.innerHTML=colListHtml(colRows(def,SAVE.col));
  }
  if(e.target&&e.target.id==="peoq"){
    peoQ=e.target.value;
    const list=document.getElementById("peolist");
    if(list) list.innerHTML=peopleListHtml(peopleRows());
  }
});

if(navigator.storage&&navigator.storage.persisted)
  navigator.storage.persisted().then(p=>{ persisted=p?"yes":"no"; });

SAVE=loadSaveState();
if(SAVE) tab="now";

// A save linked before inventory existed has no inv. If a sync link is set,
// quietly pull it once rather than making the user work out what to tap.
if(SAVE&&!SAVE.inv&&getSyncUrl()){
  refreshFromUrl().then(()=>render()).catch(()=>{});
}
load().then(s=>{checked=s;render();});

// Keep the installed app from getting stuck on an old build: check for a new
// service worker on every launch, and reload once when it takes over.
if ("serviceWorker" in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController || reloaded) return;   // fresh install shouldn't bounce
    reloaded = true;
    location.reload();
  });
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(reg => {
      const poke = () => { try { reg.update(); } catch (e) {} };
      poke();
      setInterval(poke, 60 * 60 * 1000);
      document.addEventListener("visibilitychange", () => { if (!document.hidden) poke(); });
    }).catch(() => {});
  });
}
</script>
</body>
</html>
